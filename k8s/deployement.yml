apiVersion: apps/v1
kind: Deployment
metadata:
  name: dart-app-deployment
  labels:
    app: dart-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dart-app
  template:
    metadata:
      labels:
        app: dart-app
    spec:
      containers:
      - name: dart-app
        image: your-dart-app-image:latest
        ports:
        - containerPort: 8000
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"